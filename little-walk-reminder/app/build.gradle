plugins {
    id 'com.android.application'
}

android {
    namespace 'com.teamfahad.littlewalk'
    compileSdk 35

    defaultConfig {
        applicationId 'com.teamfahad.littlewalk'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
}
