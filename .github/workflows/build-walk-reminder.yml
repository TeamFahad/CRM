name: Build Little Walk APK

on:
  push:
    branches:
      - feature/little-walk-reminder
    paths:
      - 'little-walk-reminder/**'
      - '.github/workflows/build-walk-reminder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble APK
        working-directory: little-walk-reminder
        run: gradle --no-daemon :app:assembleDebug
      - name: Give APK a friendly name
        run: cp little-walk-reminder/app/build/outputs/apk/debug/app-debug.apk Little-Walk-Reminder.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Little-Walk-Reminder-APK
          path: Little-Walk-Reminder.apk
          if-no-files-found: error
